<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYNAMIC MC - Store</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--red:#ff1a1a;--bg:#0a0a0a;--card:#161616;--text:#f0f0f0;--muted:#888}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow-x:hidden}

  /* NAV */
  nav{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.95);backdrop-filter:blur(10px);border-bottom:1px solid #1a1a1a;padding:0 60px;display:flex;align-items:center;gap:0}
  .nav-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--red);letter-spacing:3px;margin-right:40px;text-shadow:0 0 10px rgba(255,0,0,0.3)}
  .nav-tab{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:18px 20px;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none}
  .nav-tab:hover{color:#fff}
  .nav-tab.active{color:var(--red);border-bottom-color:var(--red)}

  /* PAGES */
  .page{display:none;min-height:100vh}
  .page.active{display:block}

  /* PARTICLES */
  #particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
  .particle{position:absolute;width:2px;height:2px;background:var(--red);border-radius:50%;opacity:0;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:0.6}90%{opacity:0.2}100%{transform:translateY(-10vh) scale(1.5);opacity:0}}
  body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:999}

  /* HERO */
  .hero{display:flex;align-items:center;justify-content:space-between;padding:80px 60px;min-height:90vh;position:relative;overflow:hidden;z-index:1}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 65% 50%, rgba(139,0,0,0.18) 0%, transparent 65%);pointer-events:none}
  .hero::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,26,26,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,26,26,0.03) 1px,transparent 1px);background-size:60px 60px;animation:gridmove 20s linear infinite;pointer-events:none}
  @keyframes gridmove{0%{background-position:0 0}100%{background-position:60px 60px}}
  .hero-text{flex:1;max-width:560px;z-index:2}
  .hero-badge{display:inline-block;background:rgba(255,26,26,0.08);border:1px solid rgba(255,26,26,0.4);color:var(--red);font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:4px;padding:6px 16px;margin-bottom:28px;text-transform:uppercase;position:relative;overflow:hidden}
  .hero-badge::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,26,26,0.2),transparent);animation:shimmer 3s infinite}
  @keyframes shimmer{0%{left:-100%}100%{left:200%}}
  .hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(72px,10vw,120px);line-height:0.88;letter-spacing:5px;margin-bottom:10px}
  .hero-title .line1{display:block;color:#fff;animation:slidein 0.7s ease forwards;opacity:0;animation-delay:0.2s}
  .hero-title .line2{display:block;color:var(--red);text-shadow:0 0 40px rgba(255,0,0,0.5),0 0 80px rgba(255,0,0,0.25);animation:slidein 0.7s ease forwards;opacity:0;animation-delay:0.4s;position:relative}
  .hero-title .line2::after{content:'MC';position:absolute;left:0;top:0;color:transparent;-webkit-text-stroke:1px rgba(255,26,26,0.2);animation:glitch 4s infinite}
  @keyframes glitch{0%,95%,100%{transform:translate(0)}96%{transform:translate(-3px,1px)}97%{transform:translate(3px,-1px)}98%{transform:translate(-2px,2px)}99%{transform:translate(2px,-2px)}}
  @keyframes slidein{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
  @keyframes fadein{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  .hero-sub{font-size:16px;color:var(--muted);letter-spacing:1px;margin:24px 0 0;line-height:1.7;max-width:400px;animation:fadein 0.8s ease forwards;opacity:0;animation-delay:0.6s}
  .hero-image{flex:0 0 auto;width:min(440px,44vw);z-index:2;position:relative}
  .hero-image img{width:100%;max-width:380px;filter:drop-shadow(0 0 50px rgba(255,0,0,0.45)) drop-shadow(0 0 100px rgba(180,0,0,0.2));animation:float 5s ease-in-out infinite}
  .hero-image::before{content:'';position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:60%;height:30px;background:radial-gradient(ellipse,rgba(255,0,0,0.25) 0%,transparent 70%);animation:shadow-pulse 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-18px) rotate(1deg)}}
  @keyframes shadow-pulse{0%,100%{opacity:0.5;transform:translateX(-50%) scaleX(1)}50%{opacity:0.8;transform:translateX(-50%) scaleX(0.7)}}

  /* SHARED */
  .divider{display:flex;align-items:center;gap:16px;padding:0 60px;margin:0 0 60px;position:relative;z-index:1}
  .divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#2a2a2a,transparent)}
  .divider-text{font-family:'Share Tech Mono',monospace;font-size:11px;color:#444;letter-spacing:4px;text-transform:uppercase;white-space:nowrap}
  .section{padding:30px 60px 80px;position:relative;z-index:1}
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:5px;margin-bottom:6px}
  .section-sub{color:var(--muted);font-size:14px;letter-spacing:1px;margin-bottom:50px}

  /* HOW TO JOIN */
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;position:relative}
  .steps::before{content:'';position:absolute;top:36px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,26,26,0.3),rgba(255,26,26,0.3),transparent);z-index:0}
  .step{padding:0 30px 0 0;position:relative;z-index:1}
  .step-num{width:72px;height:72px;border:1px solid rgba(255,26,26,0.35);background:var(--card);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--red);margin-bottom:24px;position:relative;transition:all 0.3s}
  .step-num::after{content:'';position:absolute;inset:-1px;border:1px solid transparent;transition:border-color 0.3s}
  .step:hover .step-num{background:rgba(255,26,26,0.08);box-shadow:0 0 20px rgba(255,0,0,0.2)}
  .step:hover .step-num::after{border-color:rgba(255,26,26,0.5)}
  .step-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:10px;color:#fff}
  .step-desc{font-size:13px;color:var(--muted);line-height:1.7}
  .ip-box{margin-top:50px;background:var(--card);border:1px solid rgba(255,26,26,0.25);padding:28px 36px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;position:relative;overflow:hidden}
  .ip-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,26,26,0.6),transparent)}
  .ip-label{font-family:'Share Tech Mono',monospace;font-size:11px;color:#555;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
  .ip-addr{font-family:'Share Tech Mono',monospace;font-size:26px;color:#fff;letter-spacing:4px}
  .ip-addr span{color:var(--red)}
  .copy-btn{background:rgba(255,26,26,0.1);border:1px solid rgba(255,26,26,0.4);color:var(--red);padding:12px 28px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:all 0.25s}
  .copy-btn:hover{background:var(--red);color:#fff;box-shadow:0 0 20px rgba(255,0,0,0.4)}

  /* WHY US */
  .features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .feat-card{background:var(--card);border:1px solid #1a1a1a;padding:30px;transition:all 0.3s;position:relative;overflow:hidden}
  .feat-card::before{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);transform:scaleX(0);transition:transform 0.4s}
  .feat-card:hover{border-color:#252525;transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
  .feat-card:hover::before{transform:scaleX(1)}
  .feat-icon{width:40px;height:40px;background:rgba(255,26,26,0.08);border:1px solid rgba(255,26,26,0.2);display:flex;align-items:center;justify-content:center;margin-bottom:20px;transition:all 0.3s}
  .feat-card:hover .feat-icon{background:rgba(255,26,26,0.15);border-color:rgba(255,26,26,0.4)}
  .feat-icon svg{width:18px;height:18px;fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .feat-title{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:2px;margin-bottom:10px}
  .feat-desc{font-size:13px;color:var(--muted);line-height:1.7}

  /* STATUS PAGE */
  .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .status-card{background:var(--card);border:1px solid #1e1e1e;padding:28px;position:relative;overflow:hidden}
  .status-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,26,26,0.4),transparent)}
  .status-card-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
  .online-dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 8px #00ff88;animation:pulse-green 2s infinite}
  @keyframes pulse-green{0%,100%{box-shadow:0 0 8px #00ff88}50%{box-shadow:0 0 16px #00ff88,0 0 24px rgba(0,255,136,0.3)}}
  .player-count{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--red);line-height:1;margin-bottom:4px}
  .player-label{font-family:'Share Tech Mono',monospace;font-size:11px;color:#555;letter-spacing:3px}
  .player-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
  .player-list::-webkit-scrollbar{width:3px}
  .player-list::-webkit-scrollbar-thumb{background:#2a2a2a}
  .player-item{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#111;border:1px solid #1e1e1e;transition:border-color 0.2s}
  .player-item:hover{border-color:#2a2a2a}
  .player-avatar{width:28px;height:28px;background:rgba(255,26,26,0.15);border:1px solid rgba(255,26,26,0.2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--red);flex-shrink:0}
  .player-name{font-family:'Share Tech Mono',monospace;font-size:13px;color:#ccc}
  .player-rank{font-size:10px;letter-spacing:1px;padding:2px 8px;margin-left:auto;font-family:'Share Tech Mono',monospace}
  .rank-legend{color:#aaa;border:1px solid #333;background:#111}
  .rank-diamond{color:#7af7ff;border:1px solid #7af7ff33;background:rgba(122,247,255,0.05)}
  .rank-gold{color:#f5a623;border:1px solid #f5a62333;background:rgba(245,166,35,0.05)}
  .rank-iron{color:#bbb;border:1px solid #bbb3;background:rgba(187,187,187,0.05)}
  .server-info{display:flex;flex-direction:column;gap:14px}
  .info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1a1a1a}
  .info-row:last-child{border-bottom:none}
  .info-key{font-family:'Share Tech Mono',monospace;font-size:11px;color:#555;letter-spacing:2px;text-transform:uppercase}
  .info-val{font-family:'Share Tech Mono',monospace;font-size:13px;color:#ddd}
  .info-val.green{color:#00ff88}
  .info-val.red{color:var(--red)}

  /* VOTE PAGE */
  .vote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .vote-card{background:var(--card);border:1px solid #1e1e1e;padding:30px;transition:all 0.3s;position:relative;overflow:hidden}
  .vote-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);transform:scaleX(0);transition:transform 0.3s}
  .vote-card:hover::before{transform:scaleX(1)}
  .vote-card:hover{border-color:#252525;transform:translateY(-3px)}
  .vote-site{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;margin-bottom:6px}
  .vote-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px}
  .vote-reward{display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:10px 14px;background:rgba(255,26,26,0.06);border:1px solid rgba(255,26,26,0.15)}
  .vote-reward-label{font-family:'Share Tech Mono',monospace;font-size:10px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-right:4px}
  .vote-reward-val{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--red)}
  .vote-btn{width:100%;background:transparent;border:1px solid rgba(255,26,26,0.4);color:var(--red);padding:11px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:all 0.25s}
  .vote-btn:hover{background:var(--red);color:#fff;box-shadow:0 0 20px rgba(255,0,0,0.3)}
  .vote-info-box{margin-top:50px;background:var(--card);border:1px solid rgba(255,26,26,0.2);padding:28px 36px;position:relative}
  .vote-info-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,26,26,0.5),transparent)}
  .vote-info-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;margin-bottom:16px}
  .vote-info-list{display:flex;flex-direction:column;gap:10px}
  .vote-info-item{display:flex;align-items:flex-start;gap:12px;font-size:13px;color:var(--muted);line-height:1.6}
  .vote-info-item::before{content:'▸';color:var(--red);flex-shrink:0;margin-top:1px}

  /* REGISTER / LOGIN PAGE */
  .cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .cmd-card{background:var(--card);border:1px solid #1e1e1e;padding:30px;position:relative;overflow:hidden}
  .cmd-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,26,26,0.4),transparent)}
  .cmd-card-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;margin-bottom:6px}
  .cmd-card-sub{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6}
  .cmd-block{background:#0d0d0d;border:1px solid #222;padding:16px 20px;margin-bottom:12px;position:relative}
  .cmd-label{font-family:'Share Tech Mono',monospace;font-size:10px;color:#444;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  .cmd-text{font-family:'Share Tech Mono',monospace;font-size:14px;color:#fff}
  .cmd-text span{color:var(--red)}
  .cmd-note{font-size:12px;color:#555;margin-top:6px;font-style:italic}
  .cmd-steps{display:flex;flex-direction:column;gap:14px;margin-top:8px}
  .cmd-step{display:flex;align-items:flex-start;gap:14px}
  .cmd-step-num{width:24px;height:24px;background:rgba(255,26,26,0.1);border:1px solid rgba(255,26,26,0.3);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--red);flex-shrink:0}
  .cmd-step-text{font-size:13px;color:var(--muted);line-height:1.6;padding-top:2px}

  /* RULES PAGE */
  .rules-list{display:flex;flex-direction:column;gap:14px}
  .rule-item{background:var(--card);border:1px solid #1e1e1e;border-left:2px solid var(--red);padding:20px 24px;display:flex;gap:20px;align-items:flex-start;transition:border-color 0.2s}
  .rule-item:hover{border-color:#252525}
  .rule-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:rgba(255,26,26,0.3);line-height:1;flex-shrink:0;width:32px}
  .rule-content{}
  .rule-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;margin-bottom:6px}
  .rule-desc{font-size:13px;color:var(--muted);line-height:1.7}
  .rule-badge{display:inline-block;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;padding:2px 8px;margin-top:8px;text-transform:uppercase}
  .badge-ban{background:rgba(255,26,26,0.1);border:1px solid rgba(255,26,26,0.3);color:var(--red)}
  .badge-mute{background:rgba(245,166,35,0.1);border:1px solid rgba(245,166,35,0.3);color:#f5a623}
  .badge-warn{background:rgba(100,100,255,0.1);border:1px solid rgba(100,100,255,0.3);color:#88aaff}

  /* FOOTER */
  footer{border-top:1px solid #161616;padding:32px 60px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
  .footer-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--red);letter-spacing:4px;text-shadow:0 0 15px rgba(255,0,0,0.3)}
  .footer-text{font-size:12px;color:#333;letter-spacing:1px}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity 0.7s ease,transform 0.7s ease}
  .reveal.visible{opacity:1;transform:translateY(0)}

  @media(max-width:900px){
    .status-grid,.cmd-grid{grid-template-columns:1fr}
    nav{padding:0 20px;overflow-x:auto}
    .nav-tab{padding:16px 14px;font-size:10px}
  }
  @media(max-width:768px){
    .hero{flex-direction:column;padding:60px 24px;text-align:center;gap:50px;min-height:auto}
    .hero-image{width:75vw}
    .section{padding:20px 24px 60px}
    .divider{padding:0 24px}
    .ip-box{flex-direction:column;text-align:center}
    footer{flex-direction:column;gap:10px;text-align:center;padding:28px 24px}
  }
</style>
</head>
<body>

<div id="particles"></div>

<nav>
  <div class="nav-logo">&#9635; DMC</div>
  <button class="nav-tab active" onclick="showPage('home')">Home</button>
  <button class="nav-tab" onclick="showPage('status')">Status</button>
  <button class="nav-tab" onclick="showPage('vote')">Vote</button>
  <button class="nav-tab" onclick="showPage('guide')">Register / Login</button>
  <button class="nav-tab" onclick="showPage('rules')">Rules</button>
</nav>

<!-- HOME PAGE -->

      <div class="hero-badge">&#9635; OFFICIAL STORE</div>
      <h1 class="hero-title">
        <span class="line1">DYNAMIC</span>
        <span class="line2">MC</span>
      </h1>
